[package]
name = "fabric-adapters"
version = "0.1.0"
edition = "2021"
description = "Provider adapters for the dispatch fabric (T031-T039)"

[dependencies]
fabric-types = { path = "../fabric-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10" # T038: sha256 digests for normalized response artifacts
